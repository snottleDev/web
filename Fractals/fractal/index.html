<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandelbrot</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #05050a;
    color: #e8e8ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.25rem;
  }
  header { text-align: center; max-width: 640px; margin-bottom: 0.75rem; }
  h1 { margin: 0 0 0.25rem; font-size: 1.35rem; }
  p.sub { margin: 0; opacity: 0.65; font-size: 0.9rem; }
  #wrap { position: relative; width: 100%; max-width: 900px; }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    cursor: zoom-in;
    background: #000;
    touch-action: manipulation;
  }
  .controls {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.85rem;
    flex-wrap: wrap;
  }
  button {
    background: rgba(255,255,255,0.08);
    color: inherit;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.15); }
  .info { margin-top: 0.6rem; font-size: 0.78rem; opacity: 0.55; text-align: center; }
  .status {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 0.7rem;
    background: rgba(0,0,0,0.5);
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0.8;
    pointer-events: none;
    color: #e8e8ef;
  }
  a.back { color: inherit; opacity: 0.6; font-size: 0.8rem; }
</style>
</head>
<body>
  <header>
    <h1>Mandelbrot set</h1>
    <p class="sub">A fractal built from one recurring rule, z &rarr; z&sup2; + c, applied over and over. Click to zoom in, double-click to zoom out.</p>
  </header>

  <div id="wrap">
    <canvas id="c" width="900" height="600"></canvas>
    <div class="status" id="status">iter: 0</div>
  </div>

  <div class="controls">
    <button id="reset">Reset view</button>
    <button id="zoomOut">Zoom out</button>
    <button id="more">More detail</button>
  </div>

  <p class="info">Rendered live in the browser, pixel by pixel &mdash; no images, no libraries.</p>
  <p class="info"><a class="back" href="../../">&larr; back to web</a></p>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const wrap = document.getElementById('wrap');

  const DEFAULT_VIEW = { cx: -0.5, cy: 0, spanX: 3.4 };
  let view = { ...DEFAULT_VIEW };
  let iterBoost = 0;

  function resizeCanvas() {
    const w = Math.min(900, wrap.clientWidth || 900);
    canvas.width = w;
    canvas.height = Math.round(w * 0.6667);
  }
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); render(); });

  function palette(t) {
    const tt = t - Math.floor(t);
    const r = Math.floor(9 * (1 - tt) * tt * tt * tt * 255);
    const g = Math.floor(15 * (1 - tt) * (1 - tt) * tt * tt * 255);
    const b = Math.floor(8.5 * (1 - tt) * (1 - tt) * (1 - tt) * tt * 255);
    return [r, g, b];
  }

  function render() {
    const w = canvas.width, h = canvas.height;
    const spanX = view.spanX;
    const spanY = spanX * (h / w);
    const x0 = view.cx - spanX / 2, y0 = view.cy - spanY / 2;
    const zoom = DEFAULT_VIEW.spanX / spanX;
    const maxIter = Math.round(120 + 60 * Math.log2(Math.max(zoom, 1)) + iterBoost);

    const img = ctx.createImageData(w, h);
    const data = img.data;

    for (let py = 0; py < h; py++) {
      const cy = y0 + (py / h) * spanY;
      for (let px = 0; px < w; px++) {
        const cx = x0 + (px / w) * spanX;

        let x = 0, y = 0, x2 = 0, y2 = 0, iter = 0;
        while (x2 + y2 <= 4 && iter < maxIter) {
          y = 2 * x * y + cy;
          x = x2 - y2 + cx;
          x2 = x * x;
          y2 = y * y;
          iter++;
        }

        const idx = (py * w + px) * 4;
        if (iter >= maxIter) {
          data[idx] = 4; data[idx + 1] = 3; data[idx + 2] = 10; data[idx + 3] = 255;
        } else {
          const logZn = Math.log(x2 + y2) / 2;
          const nu = Math.log(logZn / Math.LN2) / Math.LN2;
          const smooth = iter + 1 - nu;
          const [r, g, b] = palette(smooth / 40);
          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    statusEl.textContent = `zoom: ${zoom.toFixed(1)}x · iter: ${maxIter}`;
  }

  function zoomAt(px, py, factor) {
    const w = canvas.width, h = canvas.height;
    const spanX = view.spanX, spanY = spanX * (h / w);
    const x0 = view.cx - spanX / 2, y0 = view.cy - spanY / 2;
    const cx = x0 + (px / w) * spanX;
    const cy = y0 + (py / h) * spanY;
    view = { cx, cy, spanX: view.spanX * factor };
    render();
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * canvas.width;
    const py = (e.clientY - rect.top) / rect.height * canvas.height;
    zoomAt(px, py, 0.5);
  });
  canvas.addEventListener('dblclick', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * canvas.width;
    const py = (e.clientY - rect.top) / rect.height * canvas.height;
    zoomAt(px, py, 2);
  });

  document.getElementById('reset').addEventListener('click', () => {
    view = { ...DEFAULT_VIEW }; iterBoost = 0; render();
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    zoomAt(canvas.width / 2, canvas.height / 2, 2);
  });
  document.getElementById('more').addEventListener('click', () => {
    iterBoost += 100; render();
  });

  render();
})();
</script>
</body>
</html>
